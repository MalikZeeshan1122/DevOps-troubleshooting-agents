[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-troubleshooting-agents"
version = "0.1.0"
description = "Autonomous DevOps SRE troubleshooting agents with OODA-loop RCA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "instructor>=1.4.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
devops-agent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
